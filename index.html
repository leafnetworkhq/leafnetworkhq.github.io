<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070908" />
  <meta name="description" content="Leaf Network — a small group making things for the internet." />
  <title>Leaf Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --text: #f1f3ef;
      --muted: #a0a59e;
      --line: rgba(235, 244, 230, .11);
      --accent: #c9e6a3;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      margin: 0;
      padding: 24px;
      overflow: hidden;
      background: #070908;
      color: var(--text);
      font-family: Manrope, system-ui, sans-serif;
    }
    body::before {
      position: fixed;
      z-index: 0;
      inset: 0;
      background-image: radial-gradient(rgba(230, 240, 224, .10) .55px, transparent .7px);
      background-size: 5px 5px;
      content: "";
      opacity: .13;
      pointer-events: none;
      mask-image: radial-gradient(ellipse at center, #000, transparent 78%);
    }
    a { color: inherit; text-decoration: none; }
    #particles { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .glow {
      position: fixed;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: min(680px, 100vw);
      height: 520px;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(151, 185, 113, .075), rgba(91, 112, 77, .025) 42%, transparent 72%);
      filter: blur(18px);
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 2;
      width: min(100%, 460px);
      min-height: 330px;
      padding: 24px;
      overflow: hidden;
      border: 1px solid rgba(226, 238, 220, .16);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(24, 29, 24, .62), rgba(12, 16, 13, .57) 58%, rgba(9, 12, 10, .64));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .48), inset 0 1px rgba(255, 255, 255, .08);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      backdrop-filter: blur(18px) saturate(125%);
      animation: arrive .65s cubic-bezier(.2, .8, .2, 1) both;
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .card:hover {
      border-color: rgba(226, 238, 220, .22);
      box-shadow: 0 32px 100px rgba(0, 0, 0, .52), inset 0 1px rgba(255, 255, 255, .1);
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
    .tabs {
      display: flex;
      gap: 3px;
      padding: 4px;
      border: 1px solid rgba(235, 244, 230, .09);
      border-radius: 11px;
      background: rgba(4, 7, 5, .28);
    }
    .tab {
      flex: 1;
      padding: 9px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #a2a79f;
      cursor: pointer;
      font: 500 12px Manrope, sans-serif;
      transition: background .2s ease, color .2s ease;
    }
    .tab:hover { color: var(--text); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tab[aria-selected="true"] {
      background: rgba(225, 238, 216, .12);
      color: #f4f6f1;
      box-shadow: inset 0 0 0 1px rgba(235, 244, 230, .08);
    }
    .panel { padding: 34px 5px 5px; animation: show .25s ease both; }
    .panel[hidden] { display: none; }
    @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .org { display: flex; align-items: center; gap: 16px; }
    .org-icon {
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      border: 1px solid rgba(235, 244, 230, .18);
      border-radius: 16px;
      background: rgba(255, 255, 255, .05);
      object-fit: cover;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .22);
    }
    h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.055em; line-height: 1.2; }
    .handle { display: inline-block; margin-top: 6px; color: var(--muted); font: 10px "DM Mono", monospace; }
    .handle:hover, .member-name a:hover { color: var(--accent); }
    .description { max-width: 350px; margin: 24px 0 0; color: #c1c6bd; font-size: 14px; line-height: 1.75; }
    .section-label { margin: 0 0 14px; color: var(--muted); font: 10px "DM Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .project-list { display: grid; gap: 9px; }
    .project {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255, 255, 255, .025);
      transition: background .2s ease, border-color .2s ease;
    }
    .project:hover { border-color: rgba(235, 244, 230, .18); background: rgba(255, 255, 255, .05); }
    .project-name { color: #e7eae4; font-size: 12px; }
    .project-note { margin-top: 4px; color: var(--muted); font: 9px "DM Mono", monospace; }
    .project-state { color: #b6c4a6; font: 9px "DM Mono", monospace; }
    .member-list { display: grid; }
    .member { display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-bottom: 1px solid var(--line); }
    .member:last-child { border-bottom: 0; }
    .avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid rgba(235, 244, 230, .13);
      border-radius: 50%;
      background: rgba(255, 255, 255, .06);
      object-fit: cover;
    }
    .member-name { color: #e4e8e0; font-size: 12px; }
    .member-role { margin-top: 4px; color: var(--muted); font: 9px "DM Mono", monospace; }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { min-height: 320px; padding: 19px; border-radius: 19px; }
      .panel { padding-top: 28px; }
      .description { font-size: 13px; }
    }
    @media (max-height: 480px) and (min-width: 600px) {
      body { overflow-y: auto; }
      .card { margin: 24px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>
  <main class="card" aria-label="Leaf Network">
    <div class="tabs" role="tablist" aria-label="Portfolio sections">
      <button class="tab" id="tab-home" role="tab" aria-selected="true" aria-controls="panel-home" tabindex="0">Home</button>
      <button class="tab" id="tab-projects" role="tab" aria-selected="false" aria-controls="panel-projects" tabindex="-1">Projects</button>
      <button class="tab" id="tab-members" role="tab" aria-selected="false" aria-controls="panel-members" tabindex="-1">Members</button>
    </div>

    <section class="panel" id="panel-home" role="tabpanel" aria-labelledby="tab-home">
      <div class="org">
        <img class="org-icon" src="icon.jpeg" alt="Leaf Network icon" />
        <div>
          <h1>Leaf Network</h1>
          <a class="handle" href="https://github.com/leafnetworkhq">@leafnetworkhq</a>
        </div>
      </div>
      <p class="description">Lowkey dumb ppl 🥀</p>
    </section>

    <section class="panel" id="panel-projects" role="tabpanel" aria-labelledby="tab-projects" hidden>
      <p class="section-label">Projects</p>
      <div class="project-list">
        <div class="project"><div><div class="project-name">Project one</div><div class="project-note">A little idea</div></div><span class="project-state">IN PROGRESS</span></div>
        <div class="project"><div><div class="project-name">Project two</div><div class="project-note">Currently being built</div></div><span class="project-state">IN PROGRESS</span></div>
        <div class="project"><div><div class="project-name">Project three</div><div class="project-note">Classified</div></div><span class="project-state">SOON</span></div>
      </div>
    </section>

    <section class="panel" id="panel-members" role="tabpanel" aria-labelledby="tab-members" hidden>
      <p class="section-label">Members</p>
      <div class="member-list">
        <div class="member"><img src="https://avatars.githubusercontent.com/noodletag-ops" class="avatar" alt="" /><div><div class="member-name"><a href="https://github.com/noodletag-ops">noodletag-ops</a></div><div class="member-role">Member</div></div></div>
        <div class="member"><img src="https://avatars.githubusercontent.com/lylescouezec-cloud" class="avatar" alt="" /><div><div class="member-name"><a href="https://github.com/lylescouezec-cloud">lylescouezec-cloud</a></div><div class="member-role">Member</div></div></div>
        <div class="member"><img src="https://avatars.githubusercontent.com/NotANumber-dev" class="avatar" alt="" /><div><div class="member-name"><a href="https://github.com/NotANumber-dev">NotANumber-dev</a></div><div class="member-role">Member</div></div></div>
      </div>
    </section>
  </main>

  <script>
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = [...document.querySelectorAll('[role="tabpanel"]')];

    function activate(tab, focus = false) {
      tabs.forEach((item) => {
        const selected = item === tab;
        item.setAttribute('aria-selected', String(selected));
        item.tabIndex = selected ? 0 : -1;
      });
      panels.forEach((panel) => { panel.hidden = panel.id !== tab.getAttribute('aria-controls'); });
      if (focus) tab.focus();
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => activate(tab));
      tab.addEventListener('keydown', (event) => {
        let next = index;
        if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
        else if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
        else if (event.key === 'Home') next = 0;
        else if (event.key === 'End') next = tabs.length - 1;
        else return;
        event.preventDefault();
        activate(tabs[next], true);
      });
    });

    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let width = 0;
    let height = 0;
    let particles = [];
    let frame = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(115, Math.max(48, Math.floor(width * height / 10500)));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.25 + .35,
        vx: (Math.random() - .5) * .17,
        vy: (Math.random() - .5) * .17,
        a: Math.random() * .34 + .12,
        phase: Math.random() * Math.PI * 2,
        twinkle: Math.random() * .012 + .003
      }));
      if (frame) cancelAnimationFrame(frame);
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      for (const particle of particles) {
        if (!reduceMotion) particle.phase += particle.twinkle;
        const alpha = particle.a * (.76 + Math.sin(particle.phase) * .24);
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(218, 235, 195, ${alpha})`;
        ctx.fill();
        if (!reduceMotion) {
          particle.x += particle.vx;
          particle.y += particle.vy;
          if (particle.x < -5) particle.x = width + 5;
          if (particle.x > width + 5) particle.x = -5;
          if (particle.y < -5) particle.y = height + 5;
          if (particle.y > height + 5) particle.y = -5;
        }
      }
      if (!reduceMotion) frame = requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
  </script>
</body>
</html>
